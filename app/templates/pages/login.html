<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | SentinelVision</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .login-card {
        background: rgba(30, 41, 59, 0.45);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      }
      .form-control {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f8fafc;
        border-radius: 8px;
        padding: 0.75rem 1rem;
      }
      .form-control:focus {
        background: rgba(15, 23, 42, 0.8);
        border-color: #3b82f6;
        color: #f8fafc;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      }
      .btn-primary {
        background: #3b82f6;
        border: none;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.2s;
      }
      .btn-primary:hover {
        background: #2563eb;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .brand-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(to right, #60a5fa, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brand-icon {
        color: #3b82f6;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="text-center mb-4">
        <!-- SVG Shield Lock Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-shield-lock-fill brand-icon" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99 1.679 2.196 3.7 3.228 4.09 3.402a.495.495 0 0 0 .428 0c.39-.174 2.411-1.206 4.09-3.402 1.678-2.195 3.061-5.513 2.466-9.99a1.54 1.54 0 0 0-1.044-1.263 62 62 0 0 0-2.887-.87C9.843.266 8.69 0 8 0m0 5a1.5 1.5 0 0 1 .5 2.915 1 1 0 0 0-.5.86v.225a.5.5 0 0 0 1 0v-.225a2 2 0 0 0-1.5-1.936A1.5 1.5 0 0 1 8 5"/>
        </svg>
        <h1 class="brand-title">SentinelVision</h1>
        <p class="text-secondary small mb-0">AI-Powered CCTV Surveillance System</p>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label text-secondary small fw-semibold">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required autofocus />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Sign In</button>
        </div>
      </form>
    </div>

    <script>
      document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorAlert = document.getElementById("errorAlert");
        
        errorAlert.classList.add("d-none");
        
        const formData = new URLSearchParams();
        formData.append("username", usernameInput.value);
        formData.append("password", passwordInput.value);
        
        fetch("/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: formData
        })
        .then(async response => {
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || "Authentication failed");
          }
          return response.json();
        })
        .then(data => {
          // Redirect to the home dashboard on success
          window.location.href = "/";
        })
        .catch(err => {
          errorAlert.textContent = err.message;
          errorAlert.classList.remove("d-none");
        });
      });
    </script>
  </body>
</html>
